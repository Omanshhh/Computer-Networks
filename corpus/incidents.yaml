# Contrast case: a path-preserving leak (RFC 7908 Type 1). The real origins stay in the path,
# so path checks should flag it while ROV sees mostly valid origins.
verizon-dqe-2019:
  name: Verizon / DQE optimiser leak
  role: transit
  leaker: 396531
  upstream: 701
  start: "2019-06-24T10:00:00"
  end: "2019-06-24T13:00:00"
  baseline: ["2019-06-22T00:00:00", "2019-06-24T09:30:00"]
  collectors: [rrc00]
  checkpoints: ["2019-06-24T11:00:00", "2019-06-24T12:00:00", "2019-06-24T12:59:59"]
  expected:
    leaked_prefixes: "about 20,000 prefixes from 2,400 networks [Cloudflare]"
    first_leak_utc: "10:34:21 [Cloudflare]"
    path_tail: "... 701 396531 33154 ... [Cloudflare]"
    path_valley_pct: "should be high: AS396531 passed provider routes from AS33154 up to provider AS701"
  sources:
    - https://blog.cloudflare.com/how-verizon-and-a-bgp-optimizer-knocked-large-parts-of-the-internet-offline-today/
