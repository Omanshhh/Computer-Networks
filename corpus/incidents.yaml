# Incident corpus. Times are UTC. `expected` holds published figures the replay is checked against.
# Candidates to verify and add in step 2: AS12389 Rostelecom 2020-04-01, AS4761 Indosat 2014-04-02,
# AS23724 China Telecom 2010-04-08, plus path-preserving contrast cases (Verizon/DQE 2019-06-24).

as55410-2021:
  name: Vodafone Idea mass re-origination
  leaker: 55410
  upstream: 9498
  start: "2021-04-16T13:30:00"
  end: "2021-04-16T16:00:00"
  baseline: ["2021-04-14T00:00:00", "2021-04-16T12:00:00"]
  collectors: [rrc00]
  checkpoints: ["2021-04-16T14:00:00", "2021-04-16T14:30:00", "2021-04-16T15:00:00", "2021-04-16T15:30:00", "2021-04-16T15:59:59"]
  expected:
    baseline_v4: "about 823 IPv4 prefixes [Catchpoint]"
    baseline_v6: "8 IPv6 prefixes [Catchpoint]"
    leaked_prefixes: "30,000+ (31,000+ MANRS; 34,000+ Catchpoint across RIS and RouteViews)"
    first_leak_utc: "13:48:58 [MANRS/Catchpoint]; 13:45 first batch at rrc01 [Bhatia]"
    path_tail: "... 9498 55410 55410 55410 [Bhatia, MANRS]"
    via_upstream_pct: "all exiting via AS9498 [MANRS]"
    peers_with_leak: "64 of 73 rrc00 peers saw at least one [Catchpoint]"
    rov_then_has_roa_pct: "about 20% (just over 7,000) had ROAs [MANRS, Catchpoint]"
    lingering: ">1 h for some prefixes; 1,062 prefixes from 168 ASes still hijacked, 991 via AS9498 [Catchpoint]"
  sources:
    - https://manrs.org/?p=11068
    - https://www.catchpoint.com/blog/vodafone-idea-bgp-leak
    - https://anuragbhatia.com/2021/04/networking/isp-column/large-prefix-hijack-from-vodafone-as55410

