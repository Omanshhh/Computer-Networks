! Fastly, AS54113. Originates 167.82.163.0/24, one of its prefixes leaked by AS55410 in 2021; peers with Airtel.
frr defaults traditional
hostname fastly
ip forwarding
!
interface eth1
 ip address 10.0.3.2/30
!
interface eth2
 ip address 167.82.163.1/24
!
router bgp 54113
 bgp router-id 10.0.3.2
 no bgp ebgp-requires-policy
 neighbor 10.0.3.1 remote-as 9498
 address-family ipv4 unicast
  network 167.82.163.0/24
 exit-address-family
!
