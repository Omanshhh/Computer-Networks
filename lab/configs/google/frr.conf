! Google, AS15169. Originates 172.217.179.0/24, one of its prefixes leaked by AS55410 in 2021; peers with Airtel.
frr defaults traditional
hostname google
ip forwarding
!
interface eth1
 ip address 10.0.2.2/30
!
interface eth2
 ip address 172.217.179.1/24
!
router bgp 15169
 bgp router-id 10.0.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.2.1 remote-as 9498
 address-family ipv4 unicast
  network 172.217.179.0/24
 exit-address-family
!
