! Vodafone Idea, AS55410. Originates eight of its real prefixes; the demo's leak adds static routes
! tagged 666 that "redistribute static" re-originates to Airtel, as happened on 16 April 2021.
frr defaults traditional
hostname vodafone
ip forwarding
!
interface eth1
 ip address 10.0.1.1/30
!
interface eth2
 ip address 118.185.0.1/24
!
ip route 118.185.0.0/16 blackhole
ip route 122.15.0.0/16 blackhole
ip route 123.63.0.0/16 blackhole
ip route 123.63.128.0/18 blackhole
ip route 123.63.192.0/18 blackhole
ip route 123.63.160.0/19 blackhole
ip route 182.19.0.0/19 blackhole
ip route 182.19.32.0/19 blackhole
!
route-map LEAK permit 10
 match tag 666
!
router bgp 55410
 bgp router-id 10.0.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.2 remote-as 9498
 neighbor 10.0.1.2 description Airtel (provider)
 address-family ipv4 unicast
  network 118.185.0.0/16
  network 122.15.0.0/16
  network 123.63.0.0/16
  network 123.63.128.0/18
  network 123.63.192.0/18
  network 123.63.160.0/19
  network 182.19.0.0/19
  network 182.19.32.0/19
  redistribute static route-map LEAK
 exit-address-family
!
