! A user's ISP, AS64600, customer of Airtel. Its users reach Google, Fastly and Vodafone through Airtel.
frr defaults traditional
hostname userisp
ip forwarding
!
interface eth1
 ip address 10.0.4.2/30
!
interface eth2
 ip address 100.64.0.1/24
!
router bgp 64600
 bgp router-id 10.0.4.2
 no bgp ebgp-requires-policy
 neighbor 10.0.4.1 remote-as 9498
 address-family ipv4 unicast
  network 100.64.0.0/24
 exit-address-family
!
