! Bharti Airtel, AS9498. Gao-Rexford policy: prefer customer routes (local-pref 200 over 100 for
! peers) and export only customer routes to peers. ConeGuard adds quarantined prefixes to
! CG-QUARANTINE; max-prefix mode adds "maximum-prefix" on the Vodafone session.
frr defaults traditional
hostname airtel
ip forwarding
!
interface eth1
 ip address 10.0.1.2/30
!
interface eth2
 ip address 10.0.2.1/30
!
interface eth3
 ip address 10.0.3.1/30
!
interface eth4
 ip address 10.0.4.1/30
!
ip prefix-list CG-QUARANTINE seq 1 permit 255.255.255.255/32
bgp community-list standard FROM-CUSTOMER permit 9498:100
!
route-map FROM-VODAFONE deny 10
 match ip address prefix-list CG-QUARANTINE
route-map FROM-VODAFONE permit 20
 set local-preference 200
 set community 9498:100
!
route-map FROM-CUSTOMER permit 10
 set local-preference 200
 set community 9498:100
!
route-map FROM-PEER permit 10
 set local-preference 100
!
route-map TO-PEER permit 10
 match community FROM-CUSTOMER
route-map TO-PEER deny 20
!
router bgp 9498
 bgp router-id 10.0.1.2
 no bgp ebgp-requires-policy
 bgp route-map delay-timer 0
 neighbor 10.0.1.1 remote-as 55410
 neighbor 10.0.1.1 description Vodafone Idea (customer)
 neighbor 10.0.2.2 remote-as 15169
 neighbor 10.0.2.2 description Google (peer)
 neighbor 10.0.3.2 remote-as 54113
 neighbor 10.0.3.2 description Fastly (peer)
 neighbor 10.0.4.2 remote-as 64600
 neighbor 10.0.4.2 description User ISP (customer)
 address-family ipv4 unicast
  neighbor 10.0.1.1 soft-reconfiguration inbound
  neighbor 10.0.1.1 route-map FROM-VODAFONE in
  neighbor 10.0.2.2 route-map FROM-PEER in
  neighbor 10.0.2.2 route-map TO-PEER out
  neighbor 10.0.3.2 route-map FROM-PEER in
  neighbor 10.0.3.2 route-map TO-PEER out
  neighbor 10.0.4.2 route-map FROM-CUSTOMER in
 exit-address-family
!
